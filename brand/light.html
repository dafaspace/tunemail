<!doctype html><meta charset="utf-8"><title>light ground</title>
<style>
 @font-face{font-family:Bebas;src:url(bebas-neue-latin.woff2) format('woff2');font-display:block}
 body{margin:0;background:#eef0f6;color:#5a5a68;font:12px -apple-system,sans-serif;padding:26px}
 h2{font:600 10px -apple-system;letter-spacing:.14em;text-transform:uppercase;color:#8a8a98;margin:0 0 12px}
 .row{display:flex;gap:26px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
 .c{text-align:center}.l{margin-top:9px;font-size:10.5px}
 .lock{display:inline-flex;align-items:center;gap:15px}
 .word{font-family:Bebas,sans-serif;line-height:.82;letter-spacing:.02em;font-size:46px;color:#0d0d1a}
 .word b{color:#7c3aed;font-weight:inherit}
 .tile{width:74px;height:74px;border-radius:18px;background:#0d0d1a;display:flex;
       align-items:center;justify-content:center;flex:0 0 auto}
 .tile img{width:49px;display:block}
 img.bare{height:64px;display:block}
</style>
<h2>1 &mdash; bare mark on light: the envelope fill vanishes, it reads as line art</h2>
<div class="row"><div class="c"><div class="lock"><img class="bare" src="mark-fg.svg"><span class="word"><b>TUNE</b>MAIL</span></div><div class="l">not wrong, but thin</div></div></div>

<h2>2 &mdash; mark in its own dark tile: this is the icon we already ship</h2>
<div class="row"><div class="c"><div class="lock"><span class="tile"><img src="mark-fg.svg"></span><span class="word"><b>TUNE</b>MAIL</span></div><div class="l">no new artwork needed</div></div></div>

<h2>3 &mdash; word alone</h2>
<div class="row"><div class="c"><span class="word"><b>TUNE</b>MAIL</span><div class="l">where the mark would be redundant</div></div></div>
